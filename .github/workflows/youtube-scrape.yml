name: YouTube Scrape

on:
  schedule:
    # Sun/Tue/Thu at 09:00 UTC — 8h before the 17:00 UTC cloud routine
    # (GitHub fires scheduled runs 3–6h late on this account; the margin absorbs it)
    - cron: "0 9 * * 0,2,4"
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run YouTube RSS scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd worker && npx tsx src/youtube-scrape.ts

      - name: Pull transcripts for new videos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMPDIR: /tmp
        run: cd worker && npx tsx src/youtube-transcripts.ts
