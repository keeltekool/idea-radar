name: YouTube Scrape

on:
  schedule:
    # Sun/Tue/Thu at 09:00 UTC: collects video metadata between manual runs of `run loop youtube-radar`, so
    # nothing scrolls out of a channel feed's last 15. Transcripts are pulled by that loop on the owner's machine:
    # YouTube bot-blocks yt-dlp from GitHub runners.
    - cron: "0 9 * * 0,2,4"
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run YouTube RSS scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd worker && npx tsx src/youtube-scrape.ts

